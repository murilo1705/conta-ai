<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conta-AI</title>
<meta name="description" content="Inventário de campo com localização — módulos, ar-condicionados, banheiros, sobretetos e caixas de dejetos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #eef0ee;
    --surface: #ffffff;
    --surface-2: #e3e6e2;
    --border: #d3d7d1;
    --text: #1b1f1c;
    --text-muted: #5c625d;
    --accent: #e08900;
    --accent-ink: #3a2200;
    --accent-2: #a13d2c;
    --ok: #2f7d5b;
    --danger: #b3261e;
    --modulo: #2f6690;
    --ar: #1f9e8a;
    --banheiro: #6b5b95;
    --sobreteto: #d97706;
    --caixa: #7a5230;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,20,15,0.06), 0 4px 14px rgba(20,20,15,0.06);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14161a;
      --surface: #1c1f23;
      --surface-2: #24282c;
      --border: #33383d;
      --text: #f1efe9;
      --text-muted: #a2a8a4;
      --accent: #f0a230;
      --accent-ink: #1a1000;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161a;
    --surface: #1c1f23;
    --surface-2: #24282c;
    --border: #33383d;
    --text: #f1efe9;
    --text-muted: #a2a8a4;
    --accent: #f0a230;
    --accent-ink: #1a1000;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Barlow", -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  h1, h2, h3 {
    font-family: "Barlow Condensed", "Barlow", sans-serif;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-wrap: balance;
    margin: 0;
  }
  .mono {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  #app { display: flex; flex-direction: column; height: 100%; }

  header.topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 15px;
    flex: none;
  }
  .brand h1 { font-size: 22px; line-height: 1; }
  .brand .tagline { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .status-pill {
    font-size: 11px;
    padding: 5px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .status-pill.off .dot { background: var(--danger); }
  .status-pill.pending { color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 20%, transparent); border-color: transparent; }
  .status-pill.pending .dot { background: var(--accent); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px));
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  nav.tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 30;
  }
  nav.tabbar button {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 4px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--text-muted);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
  }
  nav.tabbar button svg { width: 22px; height: 22px; }
  nav.tabbar button.active { color: var(--accent-ink); }
  nav.tabbar button.active svg { color: var(--accent); }
  nav.tabbar .badge {
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(6px);
    background: var(--accent-2);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    border-radius: 999px;
    min-width: 15px;
    height: 15px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }

  section.tab { display: none; }
  section.tab.active { display: block; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { section.tab.active { animation: none; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .field .lbl {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field input[type="text"],
  .field textarea {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .type-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 8px;
  }
  .type-btn {
    border: 1.5px solid var(--border);
    background: var(--bg);
    border-radius: 12px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--text);
    font: inherit;
  }
  .type-btn .ico {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .type-btn .label { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.15; }
  .type-btn.selected { border-color: var(--tcolor); background: color-mix(in srgb, var(--tcolor) 12%, var(--surface)); }
  .type-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .vinculo-box {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: var(--bg);
  }
  .checkline { display: flex; align-items: flex-start; gap: 10px; }
  .checkline input { margin-top: 2px; width: 19px; height: 19px; flex: none; accent-color: var(--accent); }
  .checkline label { font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.35; }

  .gps-box {
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .gps-box.ok { border-style: solid; border-color: color-mix(in srgb, var(--ok) 50%, var(--border)); }
  .gps-box.err { border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
  .gps-status { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .gps-status .crosshair {
    width: 34px; height: 34px; flex: none;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    font-size: 16px;
  }
  .gps-box.ok .crosshair { border-color: var(--ok); color: var(--ok); }
  .gps-box.err .crosshair { border-color: var(--danger); color: var(--danger); }
  .gps-coords { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .gps-coords b { color: var(--text); }
  .gps-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 2px 7px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 22%, var(--surface));
    color: var(--accent-ink);
    margin-top: 5px;
  }

  #mapAjusteWrap { display: none; flex-direction: column; gap: 8px; }
  #mapAjusteWrap.show { display: flex; }
  #mapAjuste {
    width: 100%;
    height: 280px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-2);
  }
  .ajuste-dica {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.45;
  }

  button.btn {
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    border-radius: 12px;
    border: none;
    padding: 13px 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-accent { background: var(--accent); color: var(--accent-ink); width: 100%; }
  .btn-accent:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); width: 100%; }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn-sm { padding: 9px 13px; font-size: 13px; border-radius: 9px; width: auto; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row .btn { flex: 1 1 auto; min-width: 140px; }

  .toast {
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13.5px;
    display: none;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.4;
  }
  .toast.show { display: flex; }
  .toast.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
  .toast.err { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); color: var(--danger); }
  .toast.info { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--accent-ink); }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
  .section-title h2 { font-size: 19px; }
  .section-title .count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1.5px solid var(--chipcolor, var(--border));
    color: var(--chipcolor, var(--text));
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-family: inherit;
  }
  .chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--chipcolor); flex: none; }
  .chip.off { opacity: 0.4; }

  #mapa-wrap { display: flex; flex-direction: column; gap: 10px; }
  #map {
    width: 100%;
    height: min(56vh, 460px);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface-2);
  }
  .seg {
    display: inline-flex;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
  }
  .seg button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }
  .seg button.active { background: var(--accent); color: var(--accent-ink); }

  .leaflet-popup-content-wrapper { background: var(--surface); color: var(--text); border-radius: 10px; }
  .leaflet-popup-tip { background: var(--surface); }
  .leaflet-container { font-family: "Barlow", sans-serif; }
  .popup-card { min-width: 190px; }
  .popup-card .tipo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .popup-card .patr { font-family: "IBM Plex Mono", monospace; font-size: 15px; font-weight: 600; margin: 3px 0 6px; }
  .popup-card .meta { font-size: 12px; color: var(--text-muted); line-height: 1.55; }
  .popup-card a { color: var(--accent-2); }

  .search-row { display: flex; gap: 8px; }
  .search-row input {
    flex: 1;
    font: inherit; font-size: 16px;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .list-items { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .item-card .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--icolor); }
  .item-card .body { flex: 1; min-width: 0; }
  .item-card .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .item-card .patr { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 15px; word-break: break-all; }
  .item-card .tipo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--icolor); white-space: nowrap; }
  .item-card .meta { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
  .item-card .vinc { font-size: 12.5px; margin-top: 3px; }
  .item-card .obs { font-size: 12.5px; color: var(--text); margin-top: 4px; }

  .empty { text-align: center; padding: 40px 16px; color: var(--text-muted); font-size: 14px; }
  .empty .big { font-size: 34px; display: block; margin-bottom: 8px; }

  .fila-banner {
    display: none;
    align-items: center;
    gap: 8px;
    background: color-mix(in srgb, var(--accent) 16%, var(--surface));
    color: var(--accent-ink);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 12.5px;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .fila-banner.show { display: flex; }

  details.cfg { margin-top: 14px; }
  details.cfg summary { font-size: 12px; color: var(--text-muted); cursor: pointer; }
  .cfg-box { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .cfg-box input {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px; padding: 9px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="mark">CA</span>
      <div>
        <h1>Conta-AI</h1>
        <div class="tagline">Inventário de campo</div>
      </div>
    </div>
    <div id="statusPill" class="status-pill"><span class="dot"></span><span id="statusTxt">online</span></div>
  </header>

  <main>

    <!-- ===================== REGISTRAR ===================== -->
    <section id="tab-registrar" class="tab active">
      <div class="fila-banner" id="filaBanner">
        <span>⏳</span><span id="filaBannerTxt"></span>
      </div>

      <form id="form" class="card stack" autocomplete="off">

        <div class="field">
          <label class="lbl" for="responsavel">Quem está registrando</label>
          <input type="text" id="responsavel" placeholder="Seu nome" required>
        </div>

        <div class="field">
          <span class="lbl">Tipo de item</span>
          <div class="type-grid" id="tipoGrid"></div>
        </div>

        <div class="field">
          <label class="lbl" for="patrimonio">Patrimônio do item</label>
          <input type="text" id="patrimonio" placeholder="Ex: 0123456" required>
        </div>

        <div class="field" id="campoVinculo" hidden>
          <div class="vinculo-box">
            <div class="checkline">
              <input type="checkbox" id="temVinculo">
              <label for="temVinculo" id="vinculoPergunta">—</label>
            </div>
            <div id="vinculoCampoWrap" hidden style="margin-top:11px;">
              <label class="lbl" for="vinculoPatrimonio" id="vinculoCampoLabel">—</label>
              <input type="text" id="vinculoPatrimonio" placeholder="Patrimônio">
            </div>
          </div>
        </div>

        <div class="field">
          <label class="lbl" for="observacao">Observação (opcional)</label>
          <textarea id="observacao" placeholder="Ex: bloco B, próximo ao refeitório"></textarea>
        </div>

        <div class="field">
          <span class="lbl">Localização</span>
          <div class="gps-box" id="gpsBox">
            <div class="gps-status">
              <div class="crosshair" id="gpsCrosshair">＋</div>
              <div>
                <div id="gpsMsg">Ainda não capturada</div>
                <div class="gps-coords mono" id="gpsCoords"></div>
                <span class="gps-badge" id="gpsAjustadoBadge" hidden>Pino ajustado à mão</span>
              </div>
            </div>
            <div class="btn-row">
              <button type="button" class="btn btn-outline" id="btnGps">📍 Usar minha localização</button>
              <button type="button" class="btn btn-outline" id="btnAjustar">🗺️ Ajustar no mapa</button>
            </div>
            <div id="mapAjusteWrap">
              <div id="mapAjuste"></div>
              <p class="ajuste-dica">Arraste o alfinete ou toque no mapa para colocá-lo no ponto exato. Use o botão de satélite para enxergar o pátio.</p>
              <div class="btn-row">
                <div class="seg" role="group" aria-label="Tipo de mapa">
                  <button type="button" id="ajusteRuas" class="active">Mapa</button>
                  <button type="button" id="ajusteSat">Satélite</button>
                </div>
                <button type="button" class="btn btn-ghost btn-sm" id="btnCentralizar">Voltar à minha posição</button>
              </div>
            </div>
          </div>
        </div>

        <div id="toast" class="toast"></div>

        <button type="submit" class="btn btn-accent" id="btnSalvar" disabled>Salvar registro</button>
      </form>

      <details class="cfg">
        <summary>Configuração avançada</summary>
        <div class="cfg-box">
          <label class="lbl" for="apiUrlInput">URL do backend (Apps Script)</label>
          <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
          <button type="button" class="btn btn-ghost btn-sm" id="btnSalvarApi">Salvar URL neste aparelho</button>
        </div>
      </details>
    </section>

    <!-- ===================== MAPA ===================== -->
    <section id="tab-mapa" class="tab">
      <div class="section-title">
        <h2>Mapa coletivo</h2>
        <span class="count" id="mapaCount"></span>
      </div>
      <div id="mapa-wrap">
        <div class="seg" role="group" aria-label="Tipo de mapa">
          <button type="button" id="mapaRuas" class="active">Mapa</button>
          <button type="button" id="mapaSat">Satélite</button>
        </div>
        <div class="chips" id="chipsMapa"></div>
        <div id="map"></div>
        <button type="button" class="btn btn-outline" id="btnRecarregarMapa">↻ Recarregar dados</button>
      </div>
    </section>

    <!-- ===================== LISTA ===================== -->
    <section id="tab-lista" class="tab">
      <div class="section-title">
        <h2>Todos os registros</h2>
        <span class="count" id="listaCount"></span>
      </div>
      <div class="search-row">
        <input type="text" id="busca" placeholder="Buscar por patrimônio...">
        <button type="button" class="btn btn-outline btn-sm" id="btnRecarregarLista" aria-label="Recarregar">↻</button>
      </div>
      <div class="chips" id="chipsLista" style="margin-top:8px;"></div>
      <div class="btn-row" style="margin-top:10px;">
        <button type="button" class="btn btn-ghost btn-sm" id="btnExportar">⬇️ Baixar planilha (CSV)</button>
      </div>
      <div class="list-items" id="listaItems"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="registrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Registrar
    </button>
    <button class="tab-btn" data-tab="mapa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>
      Mapa
      <span class="badge" id="badgePendentes" hidden></span>
    </button>
    <button class="tab-btn" data-tab="lista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Lista
    </button>
  </nav>

</div>

<script>
(function(){
  "use strict";

  var DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbw5rexoXRCbfXL0JdT0ELbfHE4K_FhB9xVCTG2aKw5Iwx0hu7GWTQ5blKHEpgs19gvO/exec";

  var STORAGE = {
    responsavel: "contaai_responsavel",
    apiUrl: "contaai_api_url",
    fila: "contaai_fila",
    cache: "contaai_cache"
  };

  var CENTRO_PADRAO = [-6.05, -50.15]; // região de Carajás / S11D

  var TIPOS = {
    modulo: {
      label: "Módulo", hex: "#2f6690", emoji: "📦",
      vinculo: {
        pergunta: "Este módulo tem ar-condicionado?",
        campoLabel: "Patrimônio do ar-condicionado",
        campo: "patrimonioAC"
      }
    },
    ar_condicionado: {
      label: "Ar-condicionado", hex: "#1f9e8a", emoji: "❄️",
      vinculo: {
        pergunta: "Está instalado em um módulo ou banheiro?",
        campoLabel: "Patrimônio do módulo / banheiro",
        campo: "patrimonioModulo"
      }
    },
    banheiro: {
      label: "Banheiro", hex: "#6b5b95", emoji: "🚻",
      vinculo: {
        pergunta: "Este banheiro tem ar-condicionado?",
        campoLabel: "Patrimônio do ar-condicionado",
        campo: "patrimonioAC"
      }
    },
    sobreteto: {
      label: "Sobreteto", hex: "#d97706", emoji: "⛱️",
      vinculo: {
        pergunta: "Está acoplado em algum módulo?",
        campoLabel: "Patrimônio do módulo",
        campo: "patrimonioModulo"
      }
    },
    caixa_dejetos: {
      label: "Caixa de dejetos", hex: "#7a5230", emoji: "🗑️",
      vinculo: {
        pergunta: "Está acoplada em algum módulo?",
        campoLabel: "Patrimônio do módulo",
        campo: "patrimonioModulo"
      }
    }
  };

  /* ---------------- armazenamento local ---------------- */
  function lsGet(k, fb){ try { var v = localStorage.getItem(k); return v === null ? fb : v; } catch(e){ return fb; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function lsGetJSON(k, fb){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } }
  function lsSetJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  function getApiUrl(){
    var custom = lsGet(STORAGE.apiUrl, "");
    return custom || DEFAULT_API_URL;
  }
  function apiOk(){ var u = getApiUrl(); return !!u && u.indexOf("http") === 0; }

  var state = {
    tipoSelecionado: null,
    gps: null,            // {lat, lng, acc, ajustado}
    gpsOriginal: null,    // posição vinda do aparelho, para o botão "voltar"
    filtrosMapa: {},
    filtrosLista: {},
    registros: lsGetJSON(STORAGE.cache, []),
    map: null, markers: {}, mapLoaded: false, camadasMapa: null,
    mapAjuste: null, marcadorAjuste: null, camadasAjuste: null
  };
  Object.keys(TIPOS).forEach(function(t){ state.filtrosMapa[t] = true; state.filtrosLista[t] = true; });

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function formatarData(iso){
    if (!iso) return "—";
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      return d.toLocaleString("pt-BR", { timeZone:"America/Sao_Paulo", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
    } catch(e){ return String(iso); }
  }

  /* ---------------- status / fila offline ---------------- */
  var statusPill = document.getElementById("statusPill");
  var statusTxt = document.getElementById("statusTxt");
  var filaBanner = document.getElementById("filaBanner");
  var filaBannerTxt = document.getElementById("filaBannerTxt");
  var badgePendentes = document.getElementById("badgePendentes");

  function getFila(){ return lsGetJSON(STORAGE.fila, []); }
  function setFila(f){ lsSetJSON(STORAGE.fila, f); atualizarStatus(); }

  function atualizarStatus(){
    var fila = getFila();
    var online = navigator.onLine;
    statusPill.className = "status-pill" + (online ? "" : " off") + (fila.length ? " pending" : "");
    statusTxt.textContent = fila.length
      ? (fila.length + " pendente" + (fila.length > 1 ? "s" : ""))
      : (online ? "online" : "sem conexão");
    if (fila.length){
      filaBanner.classList.add("show");
      filaBannerTxt.textContent = fila.length + " registro" + (fila.length>1?"s":"") + " guardado" + (fila.length>1?"s":"") + " neste aparelho, aguardando conexão para enviar.";
      badgePendentes.hidden = false;
      badgePendentes.textContent = fila.length;
    } else {
      filaBanner.classList.remove("show");
      badgePendentes.hidden = true;
    }
  }

  window.addEventListener("online", function(){ atualizarStatus(); sincronizarFila(); });
  window.addEventListener("offline", atualizarStatus);
  setInterval(function(){ if (navigator.onLine) sincronizarFila(); }, 30000);

  function postRegistro(payload){
    if (!apiOk()) return Promise.reject(new Error("sem_url"));
    return fetch(getApiUrl(), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function(r){
      if (!r.ok) throw new Error("http_" + r.status);
      return r.json();
    }).then(function(j){
      if (!j || j.ok !== true) throw new Error(j && j.error ? j.error : "erro_desconhecido");
      return j;
    });
  }

  function sincronizarFila(){
    var fila = getFila();
    if (!fila.length) return;
    postRegistro(fila[0]).then(function(){
      var atual = getFila();
      atual.shift();
      setFila(atual);
      if (atual.length) sincronizarFila();
    }).catch(function(){});
  }

  /* ---------------- toast ---------------- */
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg, tipo){
    toastEl.textContent = msg;
    toastEl.className = "toast show " + (tipo || "info");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.className = "toast"; }, 6000);
  }

  /* ---------------- camadas de mapa ---------------- */
  // Em área com sinal fraco a biblioteca do mapa pode não carregar.
  // Nesse caso o resto do app continua funcionando normalmente.
  function leafletOk(){ return typeof window.L !== "undefined"; }

  function criarCamadas(){
    return {
      ruas: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "© OpenStreetMap"
      }),
      satelite: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 19, attribution: "Imagens © Esri"
      })
    };
  }

  function ligarSeletorCamada(mapa, camadas, btnRuas, btnSat){
    function trocar(qual){
      var ativa = qual === "sat" ? camadas.satelite : camadas.ruas;
      var outra = qual === "sat" ? camadas.ruas : camadas.satelite;
      if (mapa.hasLayer(outra)) mapa.removeLayer(outra);
      if (!mapa.hasLayer(ativa)) ativa.addTo(mapa);
      btnRuas.classList.toggle("active", qual !== "sat");
      btnSat.classList.toggle("active", qual === "sat");
    }
    btnRuas.addEventListener("click", function(){ trocar("ruas"); });
    btnSat.addEventListener("click", function(){ trocar("sat"); });
  }

  /* ---------------- abas ---------------- */
  var tabBtns = Array.prototype.slice.call(document.querySelectorAll(".tab-btn"));
  tabBtns.forEach(function(btn){
    btn.addEventListener("click", function(){ irParaAba(btn.getAttribute("data-tab")); });
  });
  function irParaAba(tab){
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(s){ s.classList.remove("active"); });
    document.getElementById("tab-" + tab).classList.add("active");
    tabBtns.forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-tab") === tab); });
    if (tab === "mapa"){ initMapa(); carregarRegistros(); }
    if (tab === "lista"){ carregarRegistros(); }
  }

  /* ---------------- tipo de item + vínculo ---------------- */
  var tipoGrid = document.getElementById("tipoGrid");
  var campoVinculo = document.getElementById("campoVinculo");
  var temVinculo = document.getElementById("temVinculo");
  var vinculoPergunta = document.getElementById("vinculoPergunta");
  var vinculoCampoWrap = document.getElementById("vinculoCampoWrap");
  var vinculoCampoLabel = document.getElementById("vinculoCampoLabel");
  var vinculoPatrimonio = document.getElementById("vinculoPatrimonio");

  Object.keys(TIPOS).forEach(function(key){
    var t = TIPOS[key];
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "type-btn";
    btn.style.setProperty("--tcolor", t.hex);
    btn.innerHTML = '<span class="ico" style="background:' + t.hex + '">' + t.emoji + '</span>' +
                    '<span class="label">' + t.label + '</span>';
    btn.addEventListener("click", function(){
      state.tipoSelecionado = key;
      Array.prototype.forEach.call(tipoGrid.querySelectorAll(".type-btn"), function(b){ b.classList.remove("selected"); });
      btn.classList.add("selected");
      aplicarVinculo(key);
      validarForm();
    });
    tipoGrid.appendChild(btn);
  });

  function aplicarVinculo(tipoKey){
    var v = TIPOS[tipoKey] && TIPOS[tipoKey].vinculo;
    if (!v){ campoVinculo.hidden = true; return; }
    campoVinculo.hidden = false;
    vinculoPergunta.textContent = v.pergunta;
    vinculoCampoLabel.textContent = v.campoLabel;
    vinculoPatrimonio.placeholder = v.campoLabel;
    temVinculo.checked = false;
    vinculoPatrimonio.value = "";
    vinculoCampoWrap.hidden = true;
  }

  temVinculo.addEventListener("change", function(){
    vinculoCampoWrap.hidden = !temVinculo.checked;
    if (temVinculo.checked) vinculoPatrimonio.focus();
  });

  /* ---------------- responsável ---------------- */
  var inputResponsavel = document.getElementById("responsavel");
  inputResponsavel.value = lsGet(STORAGE.responsavel, "");
  inputResponsavel.addEventListener("input", function(){
    lsSet(STORAGE.responsavel, inputResponsavel.value.trim());
    validarForm();
  });

  var inputPatrimonio = document.getElementById("patrimonio");
  inputPatrimonio.addEventListener("input", validarForm);

  /* ---------------- GPS + ajuste no mapa ---------------- */
  var gpsBox = document.getElementById("gpsBox");
  var gpsMsg = document.getElementById("gpsMsg");
  var gpsCoords = document.getElementById("gpsCoords");
  var gpsAjustadoBadge = document.getElementById("gpsAjustadoBadge");
  var btnGps = document.getElementById("btnGps");
  var btnAjustar = document.getElementById("btnAjustar");
  var mapAjusteWrap = document.getElementById("mapAjusteWrap");

  function mostrarGps(){
    if (!state.gps){
      gpsBox.className = "gps-box";
      gpsMsg.textContent = "Ainda não capturada";
      gpsCoords.innerHTML = "";
      gpsAjustadoBadge.hidden = true;
      return;
    }
    gpsBox.className = "gps-box ok";
    gpsMsg.textContent = state.gps.ajustado ? "Localização definida no mapa" : "Localização capturada";
    var precisao = state.gps.ajustado
      ? "posição escolhida manualmente"
      : (state.gps.acc ? "precisão ±" + state.gps.acc + " m" : "");
    gpsCoords.innerHTML = "<b>" + state.gps.lat.toFixed(6) + ", " + state.gps.lng.toFixed(6) + "</b>" +
                          (precisao ? " · " + precisao : "");
    gpsAjustadoBadge.hidden = !state.gps.ajustado;
    validarForm();
  }

  btnGps.addEventListener("click", function(){
    if (!("geolocation" in navigator)){
      gpsBox.className = "gps-box err";
      gpsMsg.textContent = "Este navegador não oferece GPS.";
      return;
    }
    btnGps.disabled = true;
    btnGps.textContent = "Capturando...";
    gpsMsg.textContent = "Aguardando sinal de GPS...";
    navigator.geolocation.getCurrentPosition(function(pos){
      state.gps = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        acc: Math.round(pos.coords.accuracy),
        ajustado: false
      };
      state.gpsOriginal = { lat: state.gps.lat, lng: state.gps.lng };
      btnGps.disabled = false;
      btnGps.textContent = "📍 Usar minha localização";
      mostrarGps();
      if (state.mapAjuste) posicionarAjuste(state.gps.lat, state.gps.lng, 18);
    }, function(err){
      gpsBox.className = "gps-box err";
      var msgs = {
        1: "Permissão de localização negada. Libere nas configurações do navegador, ou marque o ponto no mapa.",
        2: "Localização indisponível aqui. Marque o ponto no mapa.",
        3: "Tempo esgotado buscando o GPS. Tente de novo ou marque no mapa."
      };
      gpsMsg.textContent = msgs[err.code] || "Não foi possível capturar a localização.";
      btnGps.disabled = false;
      btnGps.textContent = "📍 Tentar novamente";
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });

  function posicionarAjuste(lat, lng, zoom){
    if (!state.mapAjuste) return;
    state.marcadorAjuste.setLatLng([lat, lng]);
    state.mapAjuste.setView([lat, lng], zoom || state.mapAjuste.getZoom());
  }

  function initMapAjuste(){
    if (!leafletOk()){
      document.getElementById("mapAjuste").innerHTML =
        '<div class="empty">O mapa não carregou — sinal fraco. ' +
        'Use o botão de localização; o registro continua funcionando.</div>';
      return;
    }
    if (state.mapAjuste){ setTimeout(function(){ state.mapAjuste.invalidateSize(); }, 60); return; }
    var inicial = state.gps ? [state.gps.lat, state.gps.lng] : CENTRO_PADRAO;
    var zoom = state.gps ? 18 : 12;
    state.mapAjuste = L.map("mapAjuste", { zoomControl: true }).setView(inicial, zoom);
    state.camadasAjuste = criarCamadas();
    state.camadasAjuste.ruas.addTo(state.mapAjuste);
    ligarSeletorCamada(state.mapAjuste, state.camadasAjuste,
      document.getElementById("ajusteRuas"), document.getElementById("ajusteSat"));

    state.marcadorAjuste = L.marker(inicial, { draggable: true }).addTo(state.mapAjuste);
    state.marcadorAjuste.on("dragend", function(){
      var p = state.marcadorAjuste.getLatLng();
      definirPontoManual(p.lat, p.lng);
    });
    state.mapAjuste.on("click", function(e){
      state.marcadorAjuste.setLatLng(e.latlng);
      definirPontoManual(e.latlng.lat, e.latlng.lng);
    });
    setTimeout(function(){ state.mapAjuste.invalidateSize(); }, 60);
  }

  function definirPontoManual(lat, lng){
    state.gps = { lat: lat, lng: lng, acc: null, ajustado: true };
    mostrarGps();
  }

  btnAjustar.addEventListener("click", function(){
    var aberto = mapAjusteWrap.classList.toggle("show");
    btnAjustar.textContent = aberto ? "🗺️ Fechar o mapa" : "🗺️ Ajustar no mapa";
    if (aberto) initMapAjuste();
  });

  document.getElementById("btnCentralizar").addEventListener("click", function(){
    if (!state.gpsOriginal){ toast("Capture a localização primeiro para poder voltar a ela.", "info"); return; }
    posicionarAjuste(state.gpsOriginal.lat, state.gpsOriginal.lng, 18);
    definirPontoManual(state.gpsOriginal.lat, state.gpsOriginal.lng);
    state.gps.ajustado = false;
    state.gps.acc = null;
    mostrarGps();
  });

  /* ---------------- validação e envio ---------------- */
  var form = document.getElementById("form");
  var btnSalvar = document.getElementById("btnSalvar");

  function validarForm(){
    var ok = inputResponsavel.value.trim() && state.tipoSelecionado && inputPatrimonio.value.trim() && state.gps;
    btnSalvar.disabled = !ok;
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if (btnSalvar.disabled) return;

    var v = TIPOS[state.tipoSelecionado].vinculo;
    var payload = {
      tipo: state.tipoSelecionado,
      patrimonio: inputPatrimonio.value.trim(),
      patrimonioModulo: "",
      patrimonioAC: "",
      observacao: document.getElementById("observacao").value.trim(),
      responsavel: inputResponsavel.value.trim(),
      lat: state.gps.lat,
      lng: state.gps.lng,
      precisao: state.gps.acc || "",
      ajusteManual: !!state.gps.ajustado
    };
    if (v && temVinculo.checked && vinculoPatrimonio.value.trim()){
      payload[v.campo] = vinculoPatrimonio.value.trim();
    }

    btnSalvar.disabled = true;
    btnSalvar.textContent = "Salvando...";

    postRegistro(payload).then(function(){
      toast("Registro salvo com sucesso.", "ok");
      limparFormParcial();
    }).catch(function(err){
      var fila = getFila();
      fila.push(payload);
      setFila(fila);
      toast(!navigator.onLine || err.message === "sem_url"
        ? "Sem conexão — guardado neste aparelho e enviado assim que a rede voltar."
        : "Não deu para enviar agora — guardado neste aparelho e será reenviado sozinho.", "info");
      limparFormParcial();
    }).then(function(){
      btnSalvar.textContent = "Salvar registro";
      validarForm();
    });
  });

  function limparFormParcial(){
    inputPatrimonio.value = "";
    document.getElementById("observacao").value = "";
    temVinculo.checked = false;
    vinculoPatrimonio.value = "";
    vinculoCampoWrap.hidden = true;
    state.gps = null;
    mostrarGps();
    // mantém responsável e tipo, para agilizar o próximo item da mesma área
  }

  /* ---------------- configuração ---------------- */
  var apiUrlInput = document.getElementById("apiUrlInput");
  apiUrlInput.value = lsGet(STORAGE.apiUrl, "");
  document.getElementById("btnSalvarApi").addEventListener("click", function(){
    lsSet(STORAGE.apiUrl, apiUrlInput.value.trim());
    toast("URL salva neste aparelho.", "ok");
    carregarRegistros();
  });

  /* ---------------- carregar dados ---------------- */
  function carregarRegistros(){
    if (!apiOk()){ renderMapa(); renderLista(); return; }
    fetch(getApiUrl()).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.ok && Array.isArray(j.registros)){
        state.registros = j.registros;
        lsSetJSON(STORAGE.cache, state.registros);
      }
      renderMapa(); renderLista();
    }).catch(function(){ renderMapa(); renderLista(); });
  }

  /* ---------------- chips ---------------- */
  function montarChips(container, filtros, onToggle){
    container.innerHTML = "";
    Object.keys(TIPOS).forEach(function(key){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (filtros[key] ? "" : " off");
      chip.style.setProperty("--chipcolor", TIPOS[key].hex);
      chip.innerHTML = '<span class="sw"></span>' + TIPOS[key].label;
      chip.addEventListener("click", function(){
        filtros[key] = !filtros[key];
        chip.classList.toggle("off", !filtros[key]);
        onToggle();
      });
      container.appendChild(chip);
    });
  }
  montarChips(document.getElementById("chipsMapa"), state.filtrosMapa, renderMapa);
  montarChips(document.getElementById("chipsLista"), state.filtrosLista, renderLista);

  /* ---------------- mapa coletivo ---------------- */
  function initMapa(){
    if (!leafletOk()){
      document.getElementById("map").innerHTML =
        '<div class="empty">O mapa não carregou — sinal fraco. ' +
        'Os registros continuam na aba Lista e podem ser exportados.</div>';
      return;
    }
    if (state.mapLoaded){ setTimeout(function(){ state.map.invalidateSize(); }, 60); return; }
    state.map = L.map("map", { zoomControl: true }).setView(CENTRO_PADRAO, 11);
    state.camadasMapa = criarCamadas();
    state.camadasMapa.ruas.addTo(state.map);
    ligarSeletorCamada(state.map, state.camadasMapa,
      document.getElementById("mapaRuas"), document.getElementById("mapaSat"));
    state.mapLoaded = true;
    setTimeout(function(){ state.map.invalidateSize(); }, 60);
  }

  function iconePara(tipo){
    var t = TIPOS[tipo] || { hex: "#555", emoji: "📍" };
    return L.divIcon({
      className: "",
      html: '<div style="width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);' +
            'background:' + t.hex + ';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);' +
            'display:flex;align-items:center;justify-content:center;">' +
            '<span style="transform:rotate(45deg);font-size:14px;">' + t.emoji + '</span></div>',
      iconSize: [30, 30], iconAnchor: [15, 29], popupAnchor: [0, -28]
    });
  }

  function vinculoTexto(reg){
    if (reg.patrimonio_modulo) return "Acoplado ao módulo " + reg.patrimonio_modulo;
    if (reg.patrimonio_ac) return "Ar-condicionado " + reg.patrimonio_ac;
    return "";
  }

  function chaveDe(reg, lat, lng){ return reg.id || (lat + "," + lng + "," + reg.patrimonio); }

  function renderMapa(){
    var count = document.getElementById("mapaCount");
    if (!state.mapLoaded){ if (count) count.textContent = ""; return; }
    Object.keys(state.markers).forEach(function(k){ state.map.removeLayer(state.markers[k]); });
    state.markers = {};
    var bounds = [], visiveis = 0;

    state.registros.forEach(function(reg){
      if (!state.filtrosMapa[reg.tipo]) return;
      var lat = parseFloat(reg.lat), lng = parseFloat(reg.lng);
      if (isNaN(lat) || isNaN(lng)) return;
      var t = TIPOS[reg.tipo] || { label: reg.tipo, hex: "#555" };
      var vinc = vinculoTexto(reg);
      var marker = L.marker([lat, lng], { icon: iconePara(reg.tipo) }).addTo(state.map);
      marker.bindPopup(
        '<div class="popup-card">' +
          '<div class="tipo" style="color:' + t.hex + '">' + escapeHtml(t.label) + '</div>' +
          '<div class="patr">' + escapeHtml(reg.patrimonio || "—") + '</div>' +
          '<div class="meta">' +
            escapeHtml(reg.responsavel || "—") + ' · ' + formatarData(reg.timestamp) +
            (vinc ? '<br>' + escapeHtml(vinc) : '') +
            (reg.observacao ? '<br>' + escapeHtml(reg.observacao) : '') +
            (reg.endereco ? '<br>' + escapeHtml(reg.endereco) : '') +
            '<br><a href="https://www.google.com/maps?q=' + lat + ',' + lng + '" target="_blank" rel="noopener">Abrir no Google Maps</a>' +
          '</div>' +
        '</div>'
      );
      state.markers[chaveDe(reg, lat, lng)] = marker;
      bounds.push([lat, lng]);
      visiveis++;
    });

    if (count) count.textContent = visiveis + " no mapa";
    if (bounds.length){
      try { state.map.fitBounds(bounds, { padding: [30,30], maxZoom: 17 }); } catch(e){}
    }
  }

  document.getElementById("btnRecarregarMapa").addEventListener("click", carregarRegistros);

  /* ---------------- lista ---------------- */
  var buscaInput = document.getElementById("busca");
  buscaInput.addEventListener("input", renderLista);
  document.getElementById("btnRecarregarLista").addEventListener("click", carregarRegistros);

  function registrosFiltrados(){
    var termo = buscaInput.value.trim().toLowerCase();
    return state.registros.filter(function(r){
      if (!state.filtrosLista[r.tipo]) return false;
      if (!termo) return true;
      return String(r.patrimonio || "").toLowerCase().indexOf(termo) !== -1
          || String(r.patrimonio_modulo || "").toLowerCase().indexOf(termo) !== -1
          || String(r.patrimonio_ac || "").toLowerCase().indexOf(termo) !== -1;
    }).sort(function(a,b){ return new Date(b.timestamp) - new Date(a.timestamp); });
  }

  function renderLista(){
    var wrap = document.getElementById("listaItems");
    var itens = registrosFiltrados();
    document.getElementById("listaCount").textContent = itens.length + " registro" + (itens.length === 1 ? "" : "s");
    wrap.innerHTML = "";

    if (!itens.length){
      wrap.innerHTML = '<div class="empty"><span class="big">🗂️</span>Nenhum registro encontrado.</div>';
      return;
    }

    itens.forEach(function(reg){
      var t = TIPOS[reg.tipo] || { label: reg.tipo || "—", hex: "#555" };
      var vinc = vinculoTexto(reg);
      var card = document.createElement("div");
      card.className = "item-card";
      card.style.setProperty("--icolor", t.hex);
      card.innerHTML =
        '<div class="dot"></div>' +
        '<div class="body">' +
          '<div class="row1"><span class="patr">' + escapeHtml(reg.patrimonio || "—") + '</span>' +
          '<span class="tipo">' + escapeHtml(t.label) + '</span></div>' +
          '<div class="meta">' + escapeHtml(reg.responsavel || "—") + ' · ' + formatarData(reg.timestamp) + '</div>' +
          (vinc ? '<div class="vinc">🔗 ' + escapeHtml(vinc) + '</div>' : '') +
          (reg.observacao ? '<div class="obs">' + escapeHtml(reg.observacao) + '</div>' : '') +
        '</div>' +
        '<button type="button" class="btn btn-ghost btn-sm">Ver no mapa</button>';

      card.querySelector("button").addEventListener("click", function(){
        irParaAba("mapa");
        initMapa();
        setTimeout(function(){
          var lat = parseFloat(reg.lat), lng = parseFloat(reg.lng);
          if (!isNaN(lat) && !isNaN(lng) && state.map){
            state.map.setView([lat, lng], 18);
            var m = state.markers[chaveDe(reg, lat, lng)];
            if (m) m.openPopup();
          }
        }, 200);
      });
      wrap.appendChild(card);
    });
  }

  /* ---------------- exportar planilha ---------------- */
  function csvCampo(v){
    var s = String(v == null ? "" : v);
    return '"' + s.replace(/"/g, '""') + '"';
  }

  document.getElementById("btnExportar").addEventListener("click", function(){
    var itens = registrosFiltrados();
    if (!itens.length){ toast("Não há registros para exportar.", "info"); return; }

    var colunas = ["Tipo","Patrimônio","Módulo acoplado","Ar-condicionado","Responsável",
                   "Data/hora","Latitude","Longitude","Precisão (m)","Pino ajustado à mão",
                   "Endereço","Link do Google Maps","Observação"];
    var linhas = [colunas.map(csvCampo).join(";")];

    itens.forEach(function(r){
      var t = TIPOS[r.tipo] || { label: r.tipo || "" };
      var lat = r.lat, lng = r.lng;
      linhas.push([
        t.label,
        r.patrimonio,
        r.patrimonio_modulo,
        r.patrimonio_ac,
        r.responsavel,
        formatarData(r.timestamp),
        String(lat).replace(".", ","),
        String(lng).replace(".", ","),
        r.precisao,
        r.ajuste_manual === "sim" ? "Sim" : "Não",
        r.endereco,
        r.link_maps || ("https://www.google.com/maps?q=" + lat + "," + lng),
        r.observacao
      ].map(csvCampo).join(";"));
    });

    var conteudo = "﻿" + linhas.join("\r\n");
    var blob = new Blob([conteudo], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var hoje = new Date();
    var nome = "conta-ai_" + hoje.getFullYear() +
               String(hoje.getMonth()+1).padStart(2,"0") +
               String(hoje.getDate()).padStart(2,"0") + ".csv";
    var a = document.createElement("a");
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast(itens.length + " registro" + (itens.length>1?"s":"") + " exportado" + (itens.length>1?"s":"") + ".", "ok");
  });

  /* ---------------- início ---------------- */
  atualizarStatus();
  mostrarGps();
  renderLista();
  if (apiOk()) carregarRegistros();
  if (getFila().length && navigator.onLine) sincronizarFila();

})();
</script>
</body>
</html>
